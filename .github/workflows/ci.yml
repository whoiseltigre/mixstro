name: CI

# Runs on every pull request and on main. Fails the PR if types, lint, design tokens,
# migration names or the production build break.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Design tokens
        run: npm run lint:design
      - name: Migration names
        run: node scripts/check-migrations.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
