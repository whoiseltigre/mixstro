<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mixstro</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0F0D0B; color: #F5F1EC; font-family: -apple-system, system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; box-sizing: border-box; }
  h1 { font-size: 24px; margin: 8px 0 0; font-weight: 650; }
  p { margin: 0; color: #A39C93; font-size: 15px; line-height: 1.45; max-width: 300px; }
  button { margin-top: 10px; height: 50px; padding: 0 28px; border: 0; border-radius: 999px; background: #FFB245; color: #0F0D0B; font-size: 16px; font-weight: 650; }
</style>
</head>
<body>
<main>
  <img src="icon.png" width="64" height="64" alt="" style="border-radius:15px">
  <h1>This page missed its cue</h1>
  <p>Mixstro needs the internet to load. Check your connection and try again.</p>
  <button onclick="location.href='https://app.mixstro.com/discover'">Try again</button>
</main>
<script>
  // The splash waits for the site to hide it; offline the site never loads, so hide it here.
  try { window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen && window.Capacitor.Plugins.SplashScreen.hide(); } catch (e) {}
</script>
</body>
</html>
